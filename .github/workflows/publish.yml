name: Publish satellite frames

on:
  schedule:
    # Hourly recovery trigger. The continuation job below maintains the 10-minute cadence.
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      continuation:
        description: Internal continuation run
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: satellite-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    outputs:
      started_epoch: ${{ steps.start.outputs.epoch }}
    env:
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      SATELLITE_STORAGE_PREFIX: ${{ vars.SATELLITE_STORAGE_PREFIX }}
      SATELLITE_FRAME_COUNT: "1"
      SATELLITE_BOOTSTRAP_LOOKBACK_MINUTES: "180"
      SATELLITE_RESTART_FROM_LATEST: ${{ (github.event_name == 'workflow_dispatch' && !inputs.continuation) && '1' || '0' }}
      SATELLITE_INPUT_WAIT_MINUTES: "10"
      SATELLITE_OWNER_TIMEOUT_MINUTES: "20"
      SATELLITE_AVIF_QUALITY: "50"
      SATELLITE_RENDER_WORKERS: "4"
      SATELLITE_WCS_DEADLINE_SECONDS: "300"
    steps:
      - name: Record run start
        id: start
        run: echo "epoch=$(date -u +%s)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Check publisher settings
        run: |
          test -n "$R2_ACCOUNT_ID" || { echo "R2_ACCOUNT_ID secret is required"; exit 1; }
          test -n "$R2_BUCKET_NAME" || { echo "R2_BUCKET_NAME secret is required"; exit 1; }
          test -n "$R2_ACCESS_KEY_ID" || { echo "R2_ACCESS_KEY_ID secret is required"; exit 1; }
          test -n "$R2_SECRET_ACCESS_KEY" || { echo "R2_SECRET_ACCESS_KEY secret is required"; exit 1; }
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.lock
      - name: Build and publish
        env:
          SATELLITE_RUNTIME_DIR: ${{ runner.temp }}/satellite-pipeline
        run: python publish_live.py

  continue:
    needs: publish
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: write
    steps:
      - name: Wait until ten minutes after the previous run started
        env:
          PREVIOUS_START_EPOCH: ${{ needs.publish.outputs.started_epoch }}
        run: |
          now_epoch="$(date -u +%s)"
          next_epoch=$(( PREVIOUS_START_EPOCH + 600 ))
          wait_seconds=$(( next_epoch - now_epoch ))
          if (( wait_seconds > 0 )); then
            echo "Waiting ${wait_seconds}s to maintain the 10-minute cadence."
            sleep "$wait_seconds"
          fi

      - name: Dispatch the next run
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          curl --fail --silent --show-error \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GH_REPOSITORY}/actions/workflows/publish.yml/dispatches" \
            --data '{"ref":"main","inputs":{"continuation":"true"}}'
          echo "Next satellite pipeline run dispatched."
